name: proclinic_revamp
description: "Revamp of ProCliniC App"
publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.10.4
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter  
  cupertino_icons: ^2.0.0
  provider: ^6.1.5+1
  intl: ^0.20.2
  go_router: ^18.0.2
  google_fonts: ^8.2.1
  file_picker: ^13.1.0
  printing: ^5.15.1
  pdf: ^3.13.1
  equatable: ^3.0.0
  mongo_dart: ^0.10.9
  image: ^4.10.1
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4

flutter:
  uses-material-design: true
  generate: true

  assets:
      - assets/images/
      - assets/lang/
      - assets/json/
      - assets/sounds/  